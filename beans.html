<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>豆リスト</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: monospace;
  padding: 16px;
  background: #f5f0eb;
  color: #222;
  max-width: 480px;
  margin: 0 auto;
}

h2 { font-size: 1.2rem; margin: 0 0 16px; color: #5c3317; }

label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 4px; }

input, textarea {
  width: 100%;
  padding: 12px;
  font-size: 1.1rem;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  margin-bottom: 12px;
  font-family: monospace;
  -webkit-appearance: none;
}

textarea { height: 80px; resize: none; }

input:focus, textarea:focus { outline: none; border-color: #8B4513; }

#saveBtn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 24px;
  font-size: 1.1rem;
  font-family: monospace;
  font-weight: bold;
  background: #5c3317;
  color: #f5f0eb;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#saveBtn:active { opacity: 0.85; }

.section-title {
  font-size: 0.8rem;
  color: #888;
  margin-bottom: 8px;
  border-bottom: 1px solid #e0d8d0;
  padding-bottom: 4px;
}

.bean-item {
  border-bottom: 1px solid #f0ebe6;
}

.bean-item:last-child { border-bottom: none; }

/* 通常行 */
.bean-main {
  display: flex;
  align-items: center;
  padding: 12px 6px;
}

.bean-main.hidden-bean { opacity: 0.4; }

.bean-info {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.bean-name { font-size: 1rem; }

.bean-memo-preview {
  font-size: 0.75rem;
  color: #888;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toggle-btn {
  padding: 8px 12px;
  font-size: 1rem;
  border: none;
  border-radius: 8px;
  background: #e8e0d8;
  color: #555;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s;
  flex-shrink: 0;
}

.toggle-btn.open { transform: rotate(90deg); }
.toggle-btn:active { opacity: 0.7; }

/* 詳細行 */
.bean-detail {
  display: none;
  padding: 6px 6px 12px;
  gap: 8px;
}

.bean-detail.open { display: flex; }

.detail-btn {
  flex: 1;
  padding: 10px 0;
  font-size: 0.95rem;
  font-family: monospace;
  border: none;
  border-radius: 8px;
  background: #e8e0d8;
  color: #333;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}

.detail-btn:active { background: #d4c8bc; }
.detail-btn:disabled { opacity: 0.3; cursor: default; }

.detail-btn.hide-btn     { color: #888; }
.detail-btn.hide-btn.on  { background: #5c3317; color: #f5f0eb; }
.detail-btn.delete-btn   { color: #c0392b; }

#emptyMsg {
  color: #aaa;
  font-size: 0.9rem;
  text-align: center;
  padding: 20px 0;
}
</style>
</head>
<body>

<h2>豆リスト</h2>

<div style="text-align:right;margin-bottom:12px;">
  <a href="index.html" style="font-family:monospace;font-size:0.85rem;color:#5c3317;text-decoration:none;background:#e8e0d8;padding:6px 12px;border-radius:6px;">→ Menu</a>
</div>

<label>豆の名前</label>
<input id="beanName" placeholder="例：エチオピア イルガチェフェ" autocomplete="off" enterkeyhint="done">

<label>メモ</label>
<textarea id="beanMemo" placeholder="例：フルーティ、酸味強め、挽目4が好み"></textarea>

<button id="saveBtn" onclick="saveBean()">保存</button>

<div class="section-title">登録済みの豆</div>
<div id="beanList"></div>

<script>
const beanNameEl = document.getElementById("beanName");
const beanMemoEl = document.getElementById("beanMemo");
const beanList   = document.getElementById("beanList");

let openName = null;

function getOrder() {
  const raw = localStorage.getItem("master_order");
  return raw ? JSON.parse(raw) : [];
}

function saveOrder(order) {
  localStorage.setItem("master_order", JSON.stringify(order));
}

function getMasterBeans() {
  const order = getOrder();
  const all = Object.keys(localStorage)
    .filter(k => k.startsWith("master_bean_"))
    .map(k => k.substring(12));
  const missing = all.filter(n => !order.includes(n));
  const merged  = [...order.filter(n => all.includes(n)), ...missing];
  if (JSON.stringify(merged) !== JSON.stringify(order)) saveOrder(merged);
  return merged;
}

function getBeanData(name) {
  const raw = localStorage.getItem("master_bean_" + name);
  return raw ? JSON.parse(raw) : {};
}

function renderList() {
  const names = getMasterBeans();
  beanList.innerHTML = "";

  if (names.length === 0) {
    beanList.innerHTML = `<div id="emptyMsg">登録された豆はありません</div>`;
    return;
  }

  names.forEach((name, idx) => {
    const data   = getBeanData(name);
    const memo   = data.memo || "";
    const hidden = !!data.hidden;

    const item = document.createElement("div");
    item.className = "bean-item";

    /* 通常行 */
    const main = document.createElement("div");
    main.className = "bean-main" + (hidden ? " hidden-bean" : "");

    /* 豆名エリア（タップで詳細展開） */
    const info = document.createElement("div");
    info.className = "bean-info";
    info.onclick = () => toggleDetail(name);

    const nameEl = document.createElement("div");
    nameEl.className = "bean-name";
    nameEl.textContent = name;
    info.appendChild(nameEl);

    if (memo) {
      const memoEl = document.createElement("div");
      memoEl.className = "bean-memo-preview";
      memoEl.textContent = memo;
      info.appendChild(memoEl);
    }

    /* ▷ボタン（編集：入力欄にセット） */
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "toggle-btn";
    toggleBtn.textContent = "✏️";
    toggleBtn.onclick = () => loadBean(name);

    main.appendChild(info);
    main.appendChild(toggleBtn);

    /* 詳細行 */
    const detail = document.createElement("div");
    detail.className = "bean-detail" + (openName === name ? " open" : "");

    const upBtn = document.createElement("button");
    upBtn.className = "detail-btn";
    upBtn.textContent = "↑";
    upBtn.disabled = idx === 0;
    upBtn.onclick = () => moveBean(idx, -1);

    const downBtn = document.createElement("button");
    downBtn.className = "detail-btn";
    downBtn.textContent = "↓";
    downBtn.disabled = idx === names.length - 1;
    downBtn.onclick = () => moveBean(idx, 1);

    const hideBtn = document.createElement("button");
    hideBtn.className = "detail-btn hide-btn" + (hidden ? " on" : "");
    hideBtn.textContent = hidden ? "表示" : "非表示";
    hideBtn.onclick = () => toggleHidden(name, hidden);

    const delBtn = document.createElement("button");
    delBtn.className = "detail-btn delete-btn";
    delBtn.textContent = "削除";
    delBtn.onclick = () => deleteBean(name);

    detail.appendChild(upBtn);
    detail.appendChild(downBtn);
    detail.appendChild(hideBtn);
    detail.appendChild(delBtn);

    item.appendChild(main);
    item.appendChild(detail);
    beanList.appendChild(item);
  });
}

function loadBean(name) {
  const data = getBeanData(name);
  beanNameEl.value = name;
  beanMemoEl.value = data.memo || "";
  beanNameEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

function toggleDetail(name) {
  openName = (openName === name) ? null : name;
  renderList();
}

function moveBean(idx, dir) {
  const order  = getMasterBeans();
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= order.length) return;
  [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
  saveOrder(order);
  renderList();
}

function toggleHidden(name, currentHidden) {
  const data = getBeanData(name);
  data.hidden = !currentHidden;
  localStorage.setItem("master_bean_" + name, JSON.stringify(data));
  if (!currentHidden) {
    const order = getMasterBeans().filter(n => n !== name);
    order.push(name);
    saveOrder(order);
    openName = null;
  }
  renderList();
}

function saveBean() {
  const name = beanNameEl.value.trim();
  if (!name) { alert("豆の名前を入力してください"); return; }

  const existing = getBeanData(name);
  const isNew = !localStorage.getItem("master_bean_" + name);
  const data = {
    memo:   beanMemoEl.value.trim(),
    hidden: existing.hidden || false
  };
  localStorage.setItem("master_bean_" + name, JSON.stringify(data));

  if (isNew) {
    const order = getOrder();
    order.unshift(name);
    saveOrder(order);
  }

  beanNameEl.value = "";
  beanMemoEl.value = "";
  renderList();
}

function deleteBean(name) {
  localStorage.removeItem("master_bean_" + name);
  const order = getOrder().filter(n => n !== name);
  saveOrder(order);
  if (openName === name) openName = null;
  renderList();
}

window.addEventListener("DOMContentLoaded", () => {
  beanNameEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  });
  renderList();
});
</script>

</body>
</html>
